<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline | Karyantrix</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1220;
      color: #fff;
      font-weight: 700;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; }
    p { font-weight: 700; font-size: 14px; color: #9aa5b8; max-width: 320px; margin: 0 0 24px; }
    button {
      background: #185FA5;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="Karyantrix" />
    <h1>You're offline</h1>
    <p>Karyantrix needs an internet connection for live bookings, chat and payments. Please check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
